<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backend Engineering Roadmap</title>
<style>
  :root {
    --bg: #f6f7fb; --surface: #fff; --text: #1b1f2a; --muted: #5d6578;
    --line: #c9cfdd; --accent: #4f46e5; --done: #16a34a; --shadow: 0 1px 3px rgba(20,25,50,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1220; --surface: #1a1e30; --text: #e8eaf3; --muted: #9aa2b8;
      --line: #343a55; --accent: #8b85ff; --done: #4ade80; --shadow: 0 1px 3px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { text-align: center; padding: 40px 16px 12px; }
  h1 { margin: 0 0 6px; font-size: 2rem; }
  header p { margin: 0; color: var(--muted); }
  .progress { max-width: 360px; margin: 18px auto 0; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }
  .progress small { color: var(--muted); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; position: relative; }
  main::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: var(--line); transform: translateX(-50%); }
  section { position: relative; margin: 36px 0; }
  section h2 { position: relative; z-index: 1; width: max-content; max-width: 100%; margin: 0 auto 18px; padding: 8px 20px;
    background: var(--accent); color: #fff; border-radius: 99px; font-size: 1rem; letter-spacing: .02em; }
  .nodes { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .node { position: relative; z-index: 1; width: min(320px, 92%); padding: 11px 16px; text-align: left; cursor: pointer;
    background: var(--surface); color: var(--text); border: 2px solid var(--line); border-radius: 10px; font: inherit; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 10px; transition: transform .12s, border-color .12s; }
  .node:hover, .node:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .node.done { border-color: var(--done); }
  .node .tick { margin-left: auto; color: var(--done); font-weight: 700; visibility: hidden; }
  .node.done .tick { visibility: visible; }
  .node small { display: block; color: var(--muted); font-size: .8rem; }
  .node.opt { border-style: dashed; }

  aside { position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100%); background: var(--surface); box-shadow: -4px 0 24px rgba(0,0,0,.25);
    transform: translateX(105%); transition: transform .25s; padding: 24px 22px; overflow-y: auto; z-index: 10; }
  aside.open { transform: none; }
  aside h3 { margin: 0 40px 8px 0; font-size: 1.3rem; }
  aside p { color: var(--muted); margin: 0 0 18px; }
  aside ul { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 8px; }
  aside li a { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--accent); text-decoration: none; font-weight: 500; }
  aside li a:hover { border-color: var(--accent); }
  aside li a span { display: block; color: var(--muted); font-weight: 400; font-size: .8rem; }
  .close { position: absolute; top: 14px; right: 14px; border: 0; background: none; font-size: 1.6rem; color: var(--muted); cursor: pointer; }
  .mark { width: 100%; padding: 10px; border: 2px solid var(--done); background: none; color: var(--done); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .mark.on { background: var(--done); color: #fff; }
  .meta { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: -4px 0 16px; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
  .chip.ok { color: var(--done); border-color: var(--done); }
  .meta button { font: inherit; font-size: .85rem; font-weight: 600; padding: 4px 12px; border-radius: 99px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--surface); color: var(--accent); }
  .meta button:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .meta .completebtn { border-color: var(--done); color: var(--done); }
  .meta .completebtn:hover:not(:disabled) { background: var(--done); color: #fff; }
  .meta button:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); color: var(--muted); }
  section.full h2 { background: var(--done); }
  aside h4 { margin: 0 0 8px; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .lvlnote { text-align: center; color: var(--muted); margin: -6px 0 16px; position: relative; z-index: 1; }
  .levels { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .lvl { position: relative; z-index: 1; width: min(420px, 100%); display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--surface); border: 2px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .lvl.ok { border-color: var(--done); }
  .lvl .emoji { font-size: 1.8rem; }
  .lvl small { display: block; color: var(--muted); font-size: .8rem; }
  .lvl button { margin-left: auto; font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 99px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--surface); color: var(--accent); }
  .lvl button:hover { background: var(--accent); color: #fff; }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .5s, transform .5s; }
  .reveal.in { opacity: 1; transform: none; }

  dialog { border: 0; border-radius: 14px; padding: 24px; width: min(480px, 92vw); background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  dialog::backdrop { background: rgba(10,12,25,.6); }
  dialog small { color: var(--muted); }
  dialog h3 { margin: 6px 28px 16px 0; font-size: 1.15rem; }
  .opts { display: grid; gap: 8px; }
  .opt-btn, .qbtn { font: inherit; text-align: left; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: none; color: var(--text); cursor: pointer; }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
  .opt-btn.right { border-color: var(--done); background: color-mix(in srgb, var(--done) 18%, transparent); }
  .opt-btn.wrong { border-color: #dc2626; background: color-mix(in srgb, #dc2626 15%, transparent); }
  .fb { margin: 14px 0 0; color: var(--muted); min-height: 1.5em; }
  .qbtn { margin-top: 14px; text-align: center; font-weight: 600; border-color: var(--accent); color: var(--accent); margin-right: 8px; }
  .qclose { position: absolute; top: 12px; right: 14px; border: 0; background: none; font-size: 1.6rem; color: var(--muted); cursor: pointer; }
  .score { font-size: 2.2rem; font-weight: 700; margin: 4px 0; }
  .pop { animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: none; } }
  footer { text-align: center; color: var(--muted); padding-bottom: 30px; font-size: .85rem; }
  footer a { color: var(--accent); }
  @media (max-width: 520px) { main::before { left: 20px; } .nodes { align-items: stretch; } .node { width: 100%; } section h2 { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Backend Engineering Roadmap</h1>
  <p>Click any node for a description and helpful links. Mark nodes as done to track progress.</p>
  <div class="progress"><div class="bar"><i id="fill"></i></div><small id="count"></small></div>
</header>
<main id="map"></main>
<aside id="panel" aria-live="polite"></aside>
<dialog id="quiz"></dialog>
<footer>Want a second opinion? See <a href="https://roadmap.sh/backend" target="_blank" rel="noopener">roadmap.sh/backend</a>.</footer>

<script>
const L = (t, u, d = "") => ({ t, u, d });
const DATA = [
 { title: "1 · Fundamentals", nodes: [
  { id: "http", name: "Internet & HTTP", desc: "How the web works: DNS, TCP, TLS, HTTP methods, status codes, headers, caching.", links: [
    L("MDN: HTTP", "https://developer.mozilla.org/en-US/docs/Web/HTTP", "Reference & guides"),
    L("High Performance Browser Networking", "https://hpbn.co/", "Free book on networking"),
    L("How DNS works (comic)", "https://howdns.works/")]},
  { id: "os", name: "OS, Linux & Terminal", desc: "Processes, threads, file systems, permissions, shell scripting, networking tools.", links: [
    L("Linux Journey", "https://linuxjourney.com/", "Interactive lessons"),
    L("The Missing Semester (MIT)", "https://missing.csail.mit.edu/", "Shell, vim, git, debugging")]},
  { id: "git", name: "Git & GitHub", desc: "Version control, branching, pull requests, code review workflows.", links: [
    L("Pro Git book", "https://git-scm.com/book/en/v2"),
    L("Learn Git Branching", "https://learngitbranching.js.org/", "Visual interactive tutorial")]},
  { id: "lang", name: "Pick a Language", desc: "Learn one language deeply: Node.js/TypeScript, Python, Go, Java/Kotlin, C#, Rust.", links: [
    L("Node.js Learn", "https://nodejs.org/en/learn"),
    L("Python Tutorial", "https://docs.python.org/3/tutorial/"),
    L("A Tour of Go", "https://go.dev/tour/"),
    L("dev.java Learn", "https://dev.java/learn/")]},
  { id: "dsa", name: "Data Structures & Algorithms", desc: "Arrays, hash maps, trees, graphs, sorting, complexity analysis.", links: [
    L("NeetCode Roadmap", "https://neetcode.io/roadmap"),
    L("VisuAlgo", "https://visualgo.net/", "Algorithm visualizations")]},
 ]},
 { title: "2 · Databases", nodes: [
  { id: "sql", name: "Relational DBs & SQL", desc: "Tables, joins, aggregation, normalization. Start with PostgreSQL.", links: [
    L("SQLBolt", "https://sqlbolt.com/", "Interactive SQL lessons"),
    L("PostgreSQL Tutorial", "https://www.postgresql.org/docs/current/tutorial.html"),
    L("Use The Index, Luke", "https://use-the-index-luke.com/", "SQL indexing & tuning")]},
  { id: "tx", name: "Transactions & Indexing", desc: "ACID, isolation levels, locks, B-tree indexes, query plans (EXPLAIN).", links: [
    L("Transaction isolation (PostgreSQL)", "https://www.postgresql.org/docs/current/transaction-iso.html"),
    L("Using EXPLAIN", "https://www.postgresql.org/docs/current/using-explain.html")]},
  { id: "nosql", name: "NoSQL (MongoDB)", desc: "Document stores, schema design, when to choose NoSQL over SQL.", links: [
    L("MongoDB University", "https://learn.mongodb.com/"),
    L("MongoDB Manual", "https://www.mongodb.com/docs/manual/")]},
  { id: "redis", name: "Redis & Caching", desc: "In-memory data structures, TTLs, cache-aside, pub/sub.", links: [
    L("Redis Docs", "https://redis.io/docs/latest/")]},
  { id: "orm", name: "ORMs & Migrations", desc: "Map code to tables, manage schema changes safely.", opt: true, links: [
    L("Prisma Docs", "https://www.prisma.io/docs"),
    L("SQLAlchemy", "https://docs.sqlalchemy.org/")]},
 ]},
 { title: "3 · APIs", nodes: [
  { id: "rest", name: "REST", desc: "Resources, verbs, idempotency, pagination, versioning, error formats.", links: [
    L("RESTful API tutorial", "https://restfulapi.net/"),
    L("OpenAPI Specification", "https://swagger.io/specification/", "Document your API")]},
  { id: "gql", name: "GraphQL", desc: "Schemas, queries, mutations, resolvers, N+1 problem.", opt: true, links: [
    L("Learn GraphQL", "https://graphql.org/learn/")]},
  { id: "grpc", name: "gRPC & Protobuf", desc: "Binary RPC for service-to-service calls.", opt: true, links: [
    L("gRPC Docs", "https://grpc.io/docs/")]},
  { id: "ws", name: "WebSockets & Realtime", desc: "Bi-directional connections, SSE, long polling.", opt: true, links: [
    L("MDN: WebSockets API", "https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API")]},
 ]},
 { title: "4 · Auth & Security", nodes: [
  { id: "authn", name: "Sessions, Cookies & JWT", desc: "Authentication strategies and their trade-offs.", links: [
    L("MDN: HTTP Authentication", "https://developer.mozilla.org/en-US/docs/Web/HTTP/Authentication"),
    L("Introduction to JWT", "https://jwt.io/introduction")]},
  { id: "oauth", name: "OAuth 2.0 & OIDC", desc: "Delegated authorization, SSO, social login.", links: [
    L("OAuth 2.0", "https://oauth.net/2/"),
    L("OpenID Connect", "https://openid.net/developers/how-connect-works/")]},
  { id: "owasp", name: "OWASP Top 10", desc: "Injection, broken access control, XSS, CSRF, SSRF, secrets management, password hashing.", links: [
    L("OWASP Top Ten", "https://owasp.org/www-project-top-ten/"),
    L("OWASP Cheat Sheets", "https://cheatsheetseries.owasp.org/")]},
 ]},
 { title: "5 · Architecture & Scale", nodes: [
  { id: "patterns", name: "Design Patterns & Clean Code", desc: "SOLID, dependency injection, layered/hexagonal architecture.", links: [
    L("Refactoring Guru", "https://refactoring.guru/design-patterns")]},
  { id: "micro", name: "Monolith vs Microservices", desc: "Boundaries, service communication, data ownership, trade-offs.", links: [
    L("Martin Fowler: Microservices", "https://martinfowler.com/articles/microservices.html"),
    L("microservices.io patterns", "https://microservices.io/")]},
  { id: "mq", name: "Message Queues & Streams", desc: "Async processing, RabbitMQ, Kafka, at-least-once delivery, idempotent consumers.", links: [
    L("RabbitMQ Tutorials", "https://www.rabbitmq.com/tutorials"),
    L("Kafka Docs", "https://kafka.apache.org/documentation/#gettingStarted")]},
  { id: "scale", name: "Scaling & System Design", desc: "Load balancing, replication, sharding, CDN, CAP theorem, rate limiting.", links: [
    L("System Design Primer", "https://github.com/donnemartin/system-design-primer"),
    L("ByteByteGo", "https://bytebytego.com/")]},
 ]},
 { title: "6 · Testing", nodes: [
  { id: "test", name: "Unit, Integration & E2E Tests", desc: "Test pyramid, mocks vs. real dependencies, contract tests.", links: [
    L("The Practical Test Pyramid", "https://martinfowler.com/articles/practical-test-pyramid.html"),
    L("Testcontainers", "https://testcontainers.com/", "Real DBs in integration tests")]},
 ]},
 { title: "7 · DevOps & Operations", nodes: [
  { id: "docker", name: "Docker", desc: "Containers, images, Dockerfile best practices, docker compose.", links: [
    L("Docker Get Started", "https://docs.docker.com/get-started/")]},
  { id: "ci", name: "CI/CD", desc: "Automated build, test, and deploy pipelines.", links: [
    L("GitHub Actions Docs", "https://docs.github.com/en/actions")]},
  { id: "cloud", name: "Cloud (AWS / GCP / Azure)", desc: "Compute, managed databases, object storage, IAM, networking.", links: [
    L("AWS Getting Started", "https://aws.amazon.com/getting-started/"),
    L("Google Cloud Skills Boost", "https://www.cloudskillsboost.google/")]},
  { id: "k8s", name: "Kubernetes", desc: "Orchestrating containers: pods, deployments, services.", opt: true, links: [
    L("Kubernetes Basics", "https://kubernetes.io/docs/tutorials/kubernetes-basics/")]},
  { id: "iac", name: "Infrastructure as Code", desc: "Provision infrastructure declaratively.", opt: true, links: [
    L("Terraform Tutorials", "https://developer.hashicorp.com/terraform/tutorials")]},
  { id: "obs", name: "Observability", desc: "Logs, metrics, traces, alerting, SLOs.", links: [
    L("Prometheus Overview", "https://prometheus.io/docs/introduction/overview/"),
    L("OpenTelemetry Docs", "https://opentelemetry.io/docs/")]},
 ]},
];

// Quiz per section (same order as DATA). First option is the correct one; options are shuffled when shown.
const Q = (q, o, e) => ({ q, o, e });
const QUIZ = [
 [ Q("Which HTTP status code means the resource was not found?", ["404", "200", "301", "500"], "404 Not Found. 5xx codes are server errors, 3xx are redirects."),
   Q("Which HTTP method is defined as 'safe' (should not change server state)?", ["GET", "POST", "PUT", "DELETE"], "GET is safe and idempotent; PUT and DELETE are idempotent but not safe."),
   Q("Which git command creates a new branch and switches to it?", ["git checkout -b feature", "git branch -d feature", "git stash feature", "git merge feature"], "`git checkout -b` (or `git switch -c`) creates and switches in one step.") ],
 [ Q("What does the 'I' in ACID stand for?", ["Isolation", "Indexing", "Idempotency", "Integration"], "Isolation: concurrent transactions don't see each other's partial work."),
   Q("What is the main purpose of a database index?", ["Speed up lookups on a column", "Encrypt the data", "Back up the table", "Enforce foreign keys"], "Indexes (e.g. B-trees) trade write cost and space for faster reads."),
   Q("Which SQL clause combines rows from two tables on a related column?", ["JOIN", "GROUP BY", "LIMIT", "DISTINCT"], "JOIN matches rows between tables using a condition like ON a.id = b.a_id.") ],
 [ Q("In REST, which HTTP method is conventionally used to create a new resource?", ["POST", "GET", "HEAD", "OPTIONS"], "POST creates; PUT replaces; PATCH partially updates."),
   Q("Which status code is the best fit after successfully creating a resource?", ["201 Created", "204 No Content", "302 Found", "418 I'm a teapot"], "201 Created, ideally with a Location header."),
   Q("What is the 'N+1 problem' in GraphQL/ORMs?", ["One query for a list plus one extra query per item", "N servers needed for 1 request", "N+1 tables in a join", "A pagination bug on page N+1"], "Batching (e.g. DataLoader) or eager loading avoids the extra per-item queries.") ],
 [ Q("How should user passwords be stored?", ["Salted hash with bcrypt/argon2", "Encrypted with AES", "Plain text", "Base64-encoded"], "Use a slow, salted password hash so leaked data can't be reversed cheaply."),
   Q("Which attack inserts malicious SQL through user input?", ["SQL injection", "CSRF", "Clickjacking", "DNS spoofing"], "Prevent it with parameterized queries / prepared statements."),
   Q("An HTTP 401 response generally means…", ["The client is not authenticated", "The user lacks permission", "The server crashed", "The resource moved"], "401 = not (properly) authenticated; 403 = authenticated but forbidden.") ],
 [ Q("What is the main benefit of a message queue?", ["Decouples producers and consumers, enabling async work", "Makes the database faster", "Removes the need for tests", "Encrypts all traffic"], "Queues smooth traffic spikes and let services fail or scale independently."),
   Q("What does the CAP theorem say about a network partition?", ["You must choose between consistency and availability", "You can have all three guarantees", "Partitions can be ignored", "It only applies to SQL"], "Under a partition a distributed system can keep either consistency or availability."),
   Q("How does the cache-aside pattern work?", ["Check cache; on a miss load from DB and populate cache", "Write only to cache", "Cache sits inside the DB engine", "Always bypass the cache on reads"], "The application owns cache population and invalidation.") ],
 [ Q("In the test pyramid, which tests should be the most numerous?", ["Unit tests", "End-to-end tests", "Manual tests", "Load tests"], "Unit tests are fast and cheap, so you want many of them."),
   Q("What is a mock used for?", ["Replacing a real dependency with a controlled fake", "Generating production data", "Measuring code coverage", "Deploying the app"], "Mocks/stubs isolate the unit under test from slow or nondeterministic dependencies."),
   Q("What does an integration test verify?", ["That several components work together (e.g. code + real DB)", "A single pure function", "UI colors", "Server hardware"], "Tools like Testcontainers make it easy to use a real database.") ],
 [ Q("What is the difference between a Docker image and a container?", ["An image is a template; a container is a running instance", "They are identical", "A container is a template; an image is running", "Images only exist on Windows"], "Many containers can be started from one image."),
   Q("What does CI stand for?", ["Continuous Integration", "Container Installation", "Code Inspection", "Cloud Infrastructure"], "CI automatically builds and tests every change."),
   Q("Which are the three classic pillars of observability?", ["Logs, metrics, traces", "CPU, RAM, disk", "Build, test, deploy", "Unit, integration, e2e"], "Together they let you answer 'what is the system doing and why?'") ],
];
const EXTRA = [
 [ Q("What does DNS do?", ["Translates domain names to IP addresses", "Encrypts HTTP traffic", "Balances server load", "Stores cookies"], "DNS is the internet's phone book: name → IP."),
   Q("Which transport protocol guarantees ordered, reliable delivery?", ["TCP", "UDP", "ICMP", "ARP"], "TCP retransmits lost packets and orders them; UDP does not.") ],
 [ Q("Which problem occurs when a transaction reads another transaction's uncommitted data?", ["Dirty read", "Deadlock", "Cache miss", "Phantom index"], "Higher isolation levels (READ COMMITTED and up) prevent dirty reads."),
   Q("What is the purpose of a database migration?", ["Version-control schema changes", "Copy data into a cache", "Encrypt backups", "Speed up joins"], "Migrations make schema changes repeatable across environments.") ],
 [ Q("What does it mean for an HTTP method to be idempotent?", ["Repeating the request has the same effect as doing it once", "It never returns a body", "It is always cached", "It requires authentication"], "PUT and DELETE are idempotent; POST generally is not."),
   Q("Which header tells the server the format of the request body?", ["Content-Type", "Accept", "Host", "Authorization"], "Accept describes what the client wants back; Content-Type describes what it sends.") ],
 [ Q("What does a JWT signature protect against?", ["Tampering with the token's contents", "Anyone reading the payload", "Token expiry", "All replay attacks"], "JWT payloads are only base64-encoded, not encrypted; the signature proves integrity."),
   Q("What does CORS control?", ["Which browser origins may call your API", "Database connections", "Password complexity", "TLS versions"], "CORS is enforced by browsers via response headers like Access-Control-Allow-Origin.") ],
 [ Q("What is an idempotent consumer?", ["One that can safely process the same message twice", "One that deletes every message", "One that never fails", "One that reads multiple queues"], "At-least-once delivery means duplicates happen, so consumers must tolerate them."),
   Q("What does horizontal scaling mean?", ["Adding more machines/instances", "Adding CPU to one machine", "Compressing data", "Using a bigger disk"], "Vertical scaling = bigger machine; horizontal = more machines.") ],
 [ Q("What is the TDD cycle?", ["Red, green, refactor", "Build, ship, pray", "Plan, code, deploy", "Mock, stub, spy"], "Write a failing test, make it pass, then clean up."),
   Q("Why are flaky tests harmful?", ["They fail randomly and erode trust in the suite", "They run too fast", "They use too little memory", "They are always integration tests"], "Teams start ignoring red builds, hiding real bugs.") ],
 [ Q("What does a Kubernetes Deployment manage?", ["Desired pod replicas and rollouts", "DNS records", "Docker image builds", "Git branches"], "It reconciles actual state to the declared replica count and image version."),
   Q("What is Infrastructure as Code?", ["Defining infrastructure in version-controlled files", "Configuring servers by hand", "A monitoring dashboard", "A container registry"], "Tools like Terraform make infrastructure reviewable and reproducible.") ],
];
QUIZ.forEach((a, i) => a.push(...EXTRA[i]));

const LEVELS = [
 { key: "junior", title: "Junior Developer", emoji: "🌱", desc: "Core web, SQL, git and basics.", qs: [
   Q("Which SQL statement removes rows from a table?", ["DELETE FROM", "REMOVE ROW", "ERASE", "TRUNCATE COLUMN"], "DELETE FROM table WHERE … removes matching rows."),
   Q("Which HTTP status class indicates a client error?", ["4xx", "2xx", "3xx", "5xx"], "4xx = client mistakes, 5xx = server failures."),
   Q("What does `git pull` do?", ["Fetches and merges remote changes", "Uploads local commits", "Deletes a branch", "Creates a tag"], "It's `git fetch` followed by a merge (or rebase)."),
   Q("What is the average-case lookup complexity of a hash map?", ["O(1)", "O(n)", "O(log n)", "O(n²)"], "Hashing gives constant-time average access."),
   Q("Why must you never commit secrets such as API keys to git?", ["They stay in history and can leak", "Git can't store text", "It slows down cloning", "Secrets expire instantly"], "Rotate any leaked secret and use env vars or a secret manager."),
   Q("What is a primary key?", ["A column that uniquely identifies each row", "Any indexed column", "The database password", "The first column in a table"], "Primary keys are unique and non-null.") ] },
 { key: "mid", title: "Mid-level Developer", emoji: "🌿", desc: "Performance, reliability and auth.", qs: [
   Q("A composite index on (a, b) efficiently supports which query filter?", ["a, or a and b", "b only", "c only", "None; it needs a full scan"], "Composite indexes follow the leftmost-prefix rule."),
   Q("What prevents double-charging when a client retries a payment request?", ["Idempotency keys", "Longer timeouts", "More servers", "Browser caching"], "The server stores the result per key and returns it on retries."),
   Q("A list endpoint is slow due to the N+1 pattern. Best fix?", ["Eager loading or a batched query", "Add more RAM", "Increase the pool size", "Disable indexes"], "Fetch related rows in one or two queries instead of one per item."),
   Q("What is the main role of a DB connection pool?", ["Reuse connections to avoid setup overhead", "Cache query results", "Encrypt connections", "Shard data"], "Opening connections is expensive; pools bound and reuse them."),
   Q("Why pair short-lived access tokens with refresh tokens?", ["Limits damage if an access token leaks", "Makes login faster", "Removes the need for HTTPS", "SQL requires it"], "A leaked access token expires quickly; refresh tokens can be revoked."),
   Q("What do multi-stage Docker builds help with?", ["Smaller images without build tools", "Running many apps in one container", "Faster CPUs", "Automatic scaling"], "Compile in one stage, copy only artifacts into a slim runtime stage.") ] },
 { key: "senior", title: "Senior Developer", emoji: "🌳", desc: "Distributed systems & trade-offs.", qs: [
   Q("A service depends on a flaky downstream. Which pattern prevents cascading failure?", ["Circuit breaker with timeouts", "Infinite retries", "A bigger thread pool", "Chaining calls synchronously"], "Fail fast, shed load, and recover gradually (half-open state)."),
   Q("How do you keep a DB write and a message publish consistent without 2PC?", ["Transactional outbox", "Publish first, then write", "Ignore failures", "Two independent cron jobs"], "Write the event to an outbox table in the same transaction, then relay it."),
   Q("What is the main risk of sharding by user_id?", ["Hot shards and costly cross-shard queries", "Losing ACID on single rows", "No indexes possible", "Backups become impossible"], "Uneven key distribution and cross-shard joins are the classic pains."),
   Q("What does eventual consistency mean?", ["Replicas converge if no new writes occur", "Reads always see the latest write", "Writes may be lost", "Transactions are serializable"], "Reads may be stale for a while, but state converges."),
   Q("Which metric trio does the RED method track?", ["Rate, Errors, Duration", "RAM, Entropy, Disk", "Read, Edit, Delete", "Retries, Events, Drops"], "RED is a service-oriented health view (USE is for resources)."),
   Q("Safest order for dropping a DB column with zero downtime?", ["Stop using it in code, deploy, then drop", "Drop it, then deploy", "Drop during peak traffic", "Rename it and hope"], "Expand/contract migrations keep old and new code compatible.") ] },
];
const need = n => Math.ceil(n * 0.6);

const KEY = "backend-roadmap-done", KEYQ = "backend-roadmap-quiz";
const KEYL = "backend-roadmap-levels";
let done = new Set(), passed = new Set(), levels = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
try { passed = new Set(JSON.parse(localStorage.getItem(KEYQ) || "[]")); } catch (e) {}
try { levels = new Set(JSON.parse(localStorage.getItem(KEYL) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); localStorage.setItem(KEYQ, JSON.stringify([...passed])); localStorage.setItem(KEYL, JSON.stringify([...levels])); } catch (e) {} };
const all = DATA.flatMap(s => s.nodes);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("map").innerHTML = DATA.map((s, i) => `
  <section class="reveal" data-s="${i}"><h2>${esc(s.title)}</h2><div class="meta"></div><div class="nodes">
  ${s.nodes.map(n => `<button class="node${n.opt ? " opt" : ""}" data-id="${n.id}">
     <span>${esc(n.name)}${n.opt ? "<small>optional</small>" : ""}</span><span class="tick">✓</span></button>`).join("")}
  </div></section>`).join("") + `
  <section class="reveal"><h2>8 · Level Check</h2>
  <p class="lvlnote">Final exams: how ready are you for a Junior, Mid-level or Senior backend role?</p>
  <div class="levels"></div></section>`;

function refresh() {
  document.querySelectorAll(".node").forEach(b => b.classList.toggle("done", done.has(b.dataset.id)));
  const p = Math.round(done.size / all.length * 100);
  $("fill").style.width = p + "%";
  $("count").textContent = `${done.size} / ${all.length} topics · ${passed.size} / ${DATA.length} quizzes passed · ${levels.size} / ${LEVELS.length} levels`;
  document.querySelector(".levels").innerHTML = LEVELS.map((l, i) => `
    <div class="lvl ${levels.has(l.key) ? "ok" : ""}"><span class="emoji">${l.emoji}</span>
      <div><b>${l.title}</b><small>${l.desc} · ${l.qs.length} questions · pass ${need(l.qs.length)}</small></div>
      <button class="lvlbtn" data-l="${i}">${levels.has(l.key) ? "✓ Retake" : "Start"}</button></div>`).join("");
  DATA.forEach((s, i) => {
    const sec = document.querySelector(`section[data-s="${i}"]`);
    const n = s.nodes.filter(x => done.has(x.id)).length, ok = passed.has(i), full = ok && n === s.nodes.length;
    sec.classList.toggle("full", full);
    sec.querySelector(".meta").innerHTML = `
      <span class="chip">${n}/${s.nodes.length} topics</span>
      <span class="chip ${ok ? "ok" : ""}">${ok ? "✓ Quiz passed" : "Quiz pending"}</span>
      <button class="quizbtn" data-s="${i}">${ok ? "Retake quiz" : "📝 Take quiz"}</button>
      <button class="completebtn" data-s="${i}" ${ok ? "" : "disabled"} title="${ok ? "" : "Pass the quiz first"}">${full ? "✓ Section completed" : "Mark section completed"}</button>`;
  });
}

// ---- quiz ----
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let qz = null;
function startQuiz(kind, id) {
  const src = kind === "s" ? { title: DATA[id].title, qs: QUIZ[id] } : { title: LEVELS[id].title + " level check", qs: LEVELS[id].qs };
  qz = { kind, id, title: src.title, i: 0, score: 0, answered: false, qs: shuffle(src.qs).map(q => ({ ...q, c: q.o[0], o: shuffle(q.o) })) };
  $("quiz").showModal(); drawQuiz();
}
function drawQuiz() {
  const d = $("quiz"), q = qz.qs[qz.i], total = qz.qs.length;
  if (!q) {
    const ok = qz.score >= need(total);
    if (ok) { (qz.kind === "s" ? passed.add(qz.id) : levels.add(LEVELS[qz.id].key)); save(); refresh(); }
    const win = qz.kind === "s" ? "🎉 Quiz passed! You can now mark this section as completed." : `🏅 You're ready for the ${LEVELS[qz.id].title} level!`;
    d.innerHTML = `<button class="qclose" aria-label="Close">×</button><small>${esc(qz.title)}</small>
      <div class="score ${ok ? "pop" : ""}">${qz.score} / ${total}</div>
      <p>${ok ? win : `You need at least ${need(total)} correct answers. Review the topics and videos, then try again.`}</p>
      ${ok ? "" : `<button class="qbtn retry">Try again</button>`}<button class="qbtn qclose2">Close</button>`;
    return;
  }
  qz.answered = false;
  d.innerHTML = `<button class="qclose" aria-label="Close">×</button>
    <small>${esc(qz.title)} · Question ${qz.i + 1} / ${total}</small><h3>${esc(q.q)}</h3>
    <div class="opts">${q.o.map(o => `<button class="opt-btn" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="fb"></div>`;
}
function answer(btn) {
  if (qz.answered) return;
  qz.answered = true;
  const q = qz.qs[qz.i], right = btn.dataset.v === q.c;
  if (right) qz.score++;
  document.querySelectorAll(".opt-btn").forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.c) b.classList.add("right");
  });
  if (!right) btn.classList.add("wrong");
  const fb = document.querySelector(".fb");
  fb.textContent = (right ? "Correct! " : "Not quite. ") + q.e;
  fb.insertAdjacentHTML("afterend", `<button class="qbtn next">${qz.i + 1 < qz.qs.length ? "Next →" : "See result"}</button>`);
}

// reveal sections on scroll
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
} else document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));

const linkList = arr => arr.map(l => `<li><a href="${l.u}" target="_blank" rel="noopener">${esc(l.t)} ↗${l.d ? `<span>${esc(l.d)}</span>` : ""}</a></li>`).join("");
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const ytLinks = n => [
  L(`${n.name} — tutorial for beginners`, yt(`${n.name} tutorial for beginners backend`), "YouTube search"),
  L(`${n.name} — crash course`, yt(`${n.name} crash course`), "YouTube search"),
  L(`${n.name} — explained in depth`, yt(`${n.name} explained deep dive`), "YouTube search")];

function open(id) {
  const n = all.find(x => x.id === id);
  $("panel").innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <h3>${esc(n.name)}</h3><p>${esc(n.desc)}</p>
    <h4>📚 Docs & articles</h4><ul>${linkList(n.links)}</ul>
    <h4>▶ Video tutorials</h4><ul>${linkList(ytLinks(n))}</ul>
    <button class="mark${done.has(id) ? " on" : ""}" data-id="${id}">${done.has(id) ? "✓ Completed" : "Mark as completed"}</button>`;
  $("panel").classList.add("open");
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t === $("quiz") || t.closest(".qclose, .qclose2")) return $("quiz").close();
  if (t.closest(".opt-btn")) return answer(t.closest(".opt-btn"));
  if (t.closest(".next")) { qz.i++; return drawQuiz(); }
  if (t.closest(".retry")) return startQuiz(qz.kind, qz.id);
  const qb = t.closest(".quizbtn");
  if (qb) return startQuiz("s", +qb.dataset.s);
  const lb = t.closest(".lvlbtn");
  if (lb) return startQuiz("l", +lb.dataset.l);
  const cb = t.closest(".completebtn");
  if (cb) {
    const s = +cb.dataset.s, ids = DATA[s].nodes.map(n => n.id), full = ids.every(id => done.has(id));
    ids.forEach(id => full ? done.delete(id) : done.add(id));
    save(); return refresh();
  }
  const node = e.target.closest(".node");
  if (node) return open(node.dataset.id);
  const mark = e.target.closest(".mark");
  if (mark) {
    const id = mark.dataset.id;
    done.has(id) ? done.delete(id) : done.add(id);
    save(); refresh(); return open(id);
  }
  if (e.target.closest(".close") || !e.target.closest("aside")) $("panel").classList.remove("open");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("panel").classList.remove("open"); });
refresh();
</script>
</body>
</html>
